          type: string
        userId:
          type: string
        type:
          type: string
          enum:
            - deposit_submitted
            - deposit_approved
            - deposit_rejected
            - withdrawal_submitted
            - withdrawal_approved
            - withdrawal_rejected
            - prediction_won
            - prediction_lost
            - wallet_credited
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
