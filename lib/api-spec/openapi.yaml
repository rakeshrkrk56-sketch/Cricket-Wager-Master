    UpdateSettingsRequest:
      type: object
      properties:
        platformUpiId:
          type: string
        platformUpiName:
          type: string
        platformUpiId2:
          type: string
        platformUpiName2:
          type: string
        platformUpiId3:
          type: string
        platformUpiName3:
          type: string
        platformName:
          type: string
        bankName:
          type: string
        bankHolderName:
          type: string
        bankAccountNumber:
          type: string
        bankIfsc:
          type: string

    # ─── Shared ────────────────────────────────────────────────────────────────
    DragonTigerPoolAmounts:
      type: object
      properties:
        DRAGON:
          type: number
        TIGER:
          type: number
        TIE:
          type: number
      required: [DRAGON, TIGER, TIE]

    DragonTigerRound:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [BETTING, REVEAL, SETTLED]
        bettingClosesAt:
          type: string
          format: date-time
        revealEndsAt:
          type: [string, "null"]
          format: date-time
        dragonRank:
          type: [integer, "null"]
          minimum: 1
          maximum: 13
        tigerRank:
          type: [integer, "null"]
          minimum: 1
          maximum: 13
        result:
          type: [string, "null"]
          enum: [DRAGON, TIGER, TIE, null]
      required: [id, status, bettingClosesAt, revealEndsAt, dragonRank, tigerRank, result]

    GameControl:
      type: object
      properties:
        mode:
          type: string
          enum: [AUTOMATIC, MANAGED]
        paused:
          type: boolean
        round:
          oneOf:
            - $ref: "#/components/schemas/DragonTigerRound"
            - type: "null"
        pools:
          $ref: "#/components/schemas/DragonTigerPoolAmounts"
        liabilities:
          $ref: "#/components/schemas/DragonTigerPoolAmounts"
        serverTime:
          type: string
          format: date-time
      required: [mode, paused, round, pools, liabilities, serverTime]

    UpdateGameControlRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [AUTOMATIC, MANAGED]
        paused:
          type: boolean
        closeBetting:
          type: boolean

    ApproveRejectRequest:
      type: object
      properties:
        remarks:
          type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        balanceAfter:
          type: number
      required:
        - success
