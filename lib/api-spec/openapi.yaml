        platformUpiId2:
          type: string
        platformUpiName2:
          type: string
        platformUpiId3:
          type: string
        platformUpiName3:
          type: string
        platformName:
          type: string
        bankName:
          type: string
        bankHolderName:
          type: string
        bankAccountNumber:
          type: string
        bankIfsc:
          type: string

    # ─── Shared ────────────────────────────────────────────────────────────────
    ApproveRejectRequest:
      type: object
