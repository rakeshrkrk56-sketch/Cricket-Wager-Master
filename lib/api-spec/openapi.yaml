openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Jazment Cricket Prediction Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: wallet
    description: Wallet operations
  - name: matches
    description: Cricket matches
  - name: markets
    description: Prediction markets
  - name: predictions
    description: User predictions
  - name: admin
    description: Admin operations
  - name: cricket
    description: Live cricket data
  - name: deposits
    description: Deposit management
  - name: withdrawals
    description: Withdrawal management
  - name: notifications
    description: In-app notifications

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Settings ────────────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get platform settings (public)
      responses:
        "200":
          description: Platform settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"

  /admin/settings:
    get:
      operationId: adminGetSettings
      tags: [admin]
      summary: Get platform settings (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Platform settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
    put:
      operationId: adminUpdateSettings
      tags: [admin]
      summary: Update platform settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"

  # ─── Auth ────────────────────────────────────────────────────────────────────
  /auth/send-otp:
    post:
      operationId: sendOtp
      tags: [auth]
      summary: Send OTP to mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpRequest"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendOtpResponse"

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify OTP and get auth token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ─── Users (Admin) ────────────────────────────────────────────────────────────
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin, users]
      summary: List all users (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

  /admin/users/{userId}:
    get:
      operationId: getUser
      tags: [admin, users]
      summary: Get user by ID (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
    patch:
      operationId: updateUser
      tags: [admin, users]
      summary: Update user status or KYC (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/users/{userId}/wallet/adjust:
    post:
      operationId: adminAdjustWallet
      tags: [admin, users]
      summary: Manually credit or debit a user wallet (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminWalletAdjustRequest"
      responses:
        "200":
          description: Wallet adjusted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWalletAdjustResponse"

  /admin/users/{userId}/deposits:
    get:
      operationId: adminGetUserDeposits
      tags: [admin, users, deposits]
      summary: List all deposits for a specific user (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: User deposit list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDepositListResponse"

  /admin/users/{userId}/withdrawals:
    get:
      operationId: adminGetUserWithdrawals
      tags: [admin, users, withdrawals]
      summary: List all withdrawals for a specific user (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: User withdrawal list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWithdrawalListResponse"

  # ─── Wallet ───────────────────────────────────────────────────────────────────
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get current user wallet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  /wallet/deposit:
    post:
      operationId: depositWallet
      tags: [wallet]
      summary: Deposit to wallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletTransactionRequest"
      responses:
        "200":
          description: Updated wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  /wallet/withdraw:
    post:
      operationId: withdrawWallet
      tags: [wallet]
      summary: Withdraw from wallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletTransactionRequest"
      responses:
        "200":
          description: Updated wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  /wallet/transactions:
    get:
      operationId: getTransactions
      tags: [wallet]
      summary: Get transaction history
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"

  # ─── Matches ──────────────────────────────────────────────────────────────────
  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List matches
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [upcoming, live, completed]
        - name: tournament
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Match list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchListResponse"

  /matches/{matchId}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Get match details
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"

  /matches/{matchId}/markets:
    get:
      operationId: getMatchMarkets
      tags: [markets]
      summary: Get markets for a match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [open, paused, closed, settled, refunded]
        - name: category
          in: query
          schema:
            type: string
            enum: [toss, innings, over, batsman, bowler, match_winner]
      responses:
        "200":
          description: Markets list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketListResponse"

  # ─── Markets ──────────────────────────────────────────────────────────────────
  /markets/{marketId}:
    get:
      operationId: getMarket
      tags: [markets]
      summary: Get market details
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Market detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"

  /markets/{marketId}/predict:
    post:
      operationId: placePrediction
      tags: [predictions]
      summary: Place a prediction on a market
      security:
        - bearerAuth: []
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacePredictionRequest"
      responses:
        "200":
          description: Prediction placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"

  # ─── User Predictions ─────────────────────────────────────────────────────────
  /predictions/my:
    get:
      operationId: getMyPredictions
      tags: [predictions]
      summary: Get current user predictions
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, won, lost, refunded]
      responses:
        "200":
          description: My predictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionListResponse"

  # ─── Admin Matches ────────────────────────────────────────────────────────────
  /admin/matches:
    get:
      operationId: adminListMatches
      tags: [admin]
      summary: List all matches (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [upcoming, live, completed]
      responses:
        "200":
          description: Match list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchListResponse"
    post:
      operationId: createMatch
      tags: [admin]
      summary: Create a new match (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatchRequest"
      responses:
        "201":
          description: Created match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /admin/matches/{matchId}:
    patch:
      operationId: updateMatch
      tags: [admin]
      summary: Update match status (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMatchRequest"
      responses:
        "200":
          description: Updated match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  # ─── Admin Markets ────────────────────────────────────────────────────────────
  /admin/matches/{matchId}/markets:
    post:
      operationId: createMarket
      tags: [admin]
      summary: Create a market for a match (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMarketRequest"
      responses:
        "201":
          description: Created market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"

  /admin/markets/{marketId}:
    patch:
      operationId: updateMarket
      tags: [admin]
      summary: Update market status or result (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMarketRequest"
      responses:
        "200":
          description: Updated market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Market"

  /admin/markets/{marketId}/settle:
    post:
      operationId: settleMarket
      tags: [admin]
      summary: Settle a market and credit winners (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettleMarketRequest"
      responses:
        "200":
          description: Settlement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementResult"

  /admin/markets/{marketId}/refund:
    post:
      operationId: refundMarket
      tags: [admin]
      summary: Refund all predictions for a market (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Refund result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementResult"

  /admin/markets/{marketId}/predictions:
    get:
      operationId: getMarketPredictions
      tags: [admin]
      summary: Get all predictions for a market (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Predictions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionListResponse"

  # ─── Admin Stats ──────────────────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform stats (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/stats/chart:
    get:
      operationId: getAdminStatsChart
      tags: [admin]
      summary: Get daily chart data (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Daily chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChartResponse"

  # ─── Cricket Live Data ────────────────────────────────────────────────────────
  /cricket/live:
    get:
      operationId: getLiveCricketMatches
      tags: [cricket]
      summary: Get live matches from CricAPI
      responses:
        "200":
          description: Live cricket matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CricketLiveResponse"

  /cricket/score/{cricMatchId}:
    get:
      operationId: getCricketScore
      tags: [cricket]
      summary: Get live score for a cricket match
      parameters:
        - name: cricMatchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CricketScoreResponse"

  # ─── Deposits ────────────────────────────────────────────────────────────────
  /deposits:
    post:
      operationId: createDeposit
      tags: [deposits]
      summary: Create a deposit request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepositRequest"
      responses:
        "201":
          description: Deposit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deposit"

  /deposits/my:
    get:
      operationId: getMyDeposits
      tags: [deposits]
      summary: Get current user deposit history
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Deposit list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositListResponse"

  /admin/deposits:
    get:
      operationId: adminListDeposits
      tags: [deposits, admin]
      summary: List all deposits (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Deposit list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDepositListResponse"

  /admin/deposits/{depositId}/approve:
    post:
      operationId: approveDeposit
      tags: [deposits, admin]
      summary: Approve a deposit and credit wallet (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: depositId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRejectRequest"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/deposits/{depositId}/reject:
    post:
      operationId: rejectDeposit
      tags: [deposits, admin]
      summary: Reject a deposit (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: depositId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRejectRequest"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ─── Withdrawals ──────────────────────────────────────────────────────────────
  /withdrawals:
    post:
      operationId: createWithdrawal
      tags: [withdrawals]
      summary: Create a withdrawal request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWithdrawalRequest"
      responses:
        "201":
          description: Withdrawal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /withdrawals/my:
    get:
      operationId: getMyWithdrawals
      tags: [withdrawals]
      summary: Get current user withdrawal history
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Withdrawal list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalListResponse"

  /admin/withdrawals:
    get:
      operationId: adminListWithdrawals
      tags: [withdrawals, admin]
      summary: List all withdrawals (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Withdrawal list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWithdrawalListResponse"

  /admin/withdrawals/{withdrawalId}/approve:
    post:
      operationId: approveWithdrawal
      tags: [withdrawals, admin]
      summary: Approve a withdrawal and deduct wallet (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: withdrawalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRejectRequest"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/withdrawals/{withdrawalId}/reject:
    post:
      operationId: rejectWithdrawal
      tags: [withdrawals, admin]
      summary: Reject a withdrawal (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: withdrawalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRejectRequest"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ─── Notifications ────────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get current user notifications
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a single notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"


  # ─── Support ─────────────────────────────────────────────────────────────────

  /support/tickets:
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Create a support ticket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportTicketRequest"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"

  /support/tickets/my:
    get:
      operationId: getMyTickets
      tags: [support]
      summary: Get current user's tickets
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Ticket list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketListResponse"

  /support/tickets/{ticketId}:
    get:
      operationId: getSupportTicket
      tags: [support]
      summary: Get ticket detail and messages
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetailResponse"

  /support/tickets/{ticketId}/messages:
    post:
      operationId: addTicketMessage
      tags: [support]
      summary: Reply to a ticket
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTicketMessageRequest"
      responses:
        "201":
          description: Message added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketMessage"

  /admin/support/tickets:
    get:
      operationId: adminListSupportTickets
      tags: [support, admin]
      summary: List all support tickets (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, resolved, closed]
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Ticket list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTicketListResponse"

  /admin/support/tickets/{ticketId}:
    get:
      operationId: adminGetSupportTicket
      tags: [support, admin]
      summary: Get ticket detail for admin
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ticket detail with user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTicketDetailResponse"

  /admin/support/tickets/{ticketId}/reply:
    post:
      operationId: adminReplyToTicket
      tags: [support, admin]
      summary: Admin reply to a ticket
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTicketMessageRequest"
      responses:
        "201":
          description: Reply sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketMessage"

  /admin/support/tickets/{ticketId}/status:
    patch:
      operationId: adminUpdateTicketStatus
      tags: [support, admin]
      summary: Update ticket status (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTicketStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ─── Support ─────────────────────────────────────────────────────────────────

    SupportTicket:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        subject:
          type: string
        category:
          type: string
          enum: [deposit_issue, withdrawal_issue, prediction_issue, kyc_issue, account_issue, technical_problem, other]
        description:
          type: string
        hasScreenshot:
          type: boolean
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        createdAt:
          type: string
        updatedAt:
          type: string
        resolvedAt:
          type: string
          nullable: true
      required:
        - id
        - userId
        - subject
        - category
        - description
        - hasScreenshot
        - status
        - createdAt
        - updatedAt

    TicketMessage:
      type: object
      properties:
        id:
          type: string
        ticketId:
          type: string
        senderId:
          type: string
          nullable: true
        isAdmin:
          type: boolean
        message:
          type: string
        createdAt:
          type: string
      required:
        - id
        - ticketId
        - isAdmin
        - message
        - createdAt

    CreateSupportTicketRequest:
      type: object
      properties:
        subject:
          type: string
        category:
          type: string
        description:
          type: string
        screenshotBase64:
          type: string
      required:
        - subject
        - category
        - description

    AddTicketMessageRequest:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    UpdateTicketStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
      required:
        - status

    TicketListResponse:
      type: object
      properties:
        tickets:
          type: array
          items:
            $ref: "#/components/schemas/SupportTicket"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - tickets
        - total
        - page
        - limit

    TicketDetailResponse:
      type: object
      properties:
        ticket:
          $ref: "#/components/schemas/SupportTicket"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/TicketMessage"
      required:
        - ticket
        - messages

    AdminTicketUser:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        name:
          type: string
          nullable: true
      required:
        - id
        - phone

    AdminTicketListItem:
      allOf:
        - $ref: "#/components/schemas/SupportTicket"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/AdminTicketUser"

    AdminTicketListResponse:
      type: object
      properties:
        tickets:
          type: array
          items:
            $ref: "#/components/schemas/AdminTicketListItem"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - tickets
        - total
        - page
        - limit

    AdminTicketDetailResponse:
      type: object
      properties:
        ticket:
          allOf:
            - $ref: "#/components/schemas/SupportTicket"
            - type: object
              properties:
                user:
                  nullable: true
        messages:
          type: array
          items:
            $ref: "#/components/schemas/TicketMessage"
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/TransactionSummary"
      required:
        - ticket
        - messages
        - recentTransactions

    TransactionSummary:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        amount:
          type: number
        status:
          type: string
        createdAt:
          type: string
      required:
        - id
        - type
        - amount
        - status
        - createdAt

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── Auth ──────────────────────────────────────────────────────────────────
    SendOtpRequest:
      type: object
      properties:
        phone:
          type: string
          description: Mobile number with country code (e.g. +919876543210)
      required:
        - phone

    SendOtpResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        otpId:
          type: string
      required:
        - success
        - message

    VerifyOtpRequest:
      type: object
      properties:
        phone:
          type: string
        otp:
          type: string
      required:
        - phone
        - otp

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    # ─── User ──────────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        name:
          type: string
        walletBalance:
          type: number
        kycStatus:
          type: string
          enum: [pending, verified, rejected]
        status:
          type: string
          enum: [active, suspended]
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - phone
        - walletBalance
        - kycStatus
        - status
        - role
        - createdAt

    UserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            totalPredictions:
              type: integer
            totalWon:
              type: integer
            totalLost:
              type: integer
            totalAmountBet:
              type: number
            totalAmountWon:
              type: number

    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - users
        - total
        - page
        - limit

    UpdateUserRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, suspended]
        kycStatus:
          type: string
          enum: [pending, verified, rejected]
        name:
          type: string

    AdminWalletAdjustRequest:
      type: object
      properties:
        type:
          type: string
          enum: [credit, debit]
        amount:
          type: number
          minimum: 1
        reason:
          type: string
      required:
        - type
        - amount
        - reason

    AdminWalletAdjustResponse:
      type: object
      properties:
        success:
          type: boolean
        balanceBefore:
          type: number
        balanceAfter:
          type: number
        type:
          type: string
          enum: [credit, debit]
        amount:
          type: number
      required:
        - success
        - balanceBefore
        - balanceAfter
        - type
        - amount

    # ─── Wallet ────────────────────────────────────────────────────────────────
    Wallet:
      type: object
      properties:
        userId:
          type: string
        balance:
          type: number
        depositTotal:
          type: number
        withdrawTotal:
          type: number
        winTotal:
          type: number
        bonusTotal:
          type: number
      required:
        - userId
        - balance
        - depositTotal
        - withdrawTotal
        - winTotal
        - bonusTotal

    WalletTransactionRequest:
      type: object
      properties:
        amount:
          type: number
          minimum: 1
        note:
          type: string
      required:
        - amount

    Transaction:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
          enum: [deposit, withdraw, win, loss, bonus, refund]
        amount:
          type: number
        balanceBefore:
          type: number
        balanceAfter:
          type: number
        status:
          type: string
          enum: [completed, pending, reversed]
        referenceId:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - type
        - amount
        - balanceAfter
        - createdAt

    TransactionListResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - transactions
        - total
        - page
        - limit

    # ─── Match ─────────────────────────────────────────────────────────────────
    Match:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        team1:
          type: string
        team2:
          type: string
        tournament:
          type: string
        startTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [upcoming, live, completed, cancelled]
        cricApiMatchId:
          type: string
        liveScore:
          $ref: "#/components/schemas/LiveScore"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - team1
        - team2
        - tournament
        - startTime
        - status
        - createdAt

    MatchDetail:
      allOf:
        - $ref: "#/components/schemas/Match"
        - type: object
          properties:
            openMarketsCount:
              type: integer
            totalPredictions:
              type: integer

    MatchListResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/Match"
        total:
          type: integer
      required:
        - matches
        - total

    LiveScore:
      type: object
      properties:
        score:
          type: string
        overs:
          type: string
        battingTeam:
          type: string
        status:
          type: string

    CreateMatchRequest:
      type: object
      properties:
        team1:
          type: string
        team2:
          type: string
        tournament:
          type: string
        startTime:
          type: string
          format: date-time
        cricApiMatchId:
          type: string
      required:
        - team1
        - team2
        - tournament
        - startTime

    UpdateMatchRequest:
      type: object
      properties:
        status:
          type: string
          enum: [upcoming, live, completed, cancelled]
        title:
          type: string

    # ─── Market ────────────────────────────────────────────────────────────────
    Market:
      type: object
      properties:
        id:
          type: string
        matchId:
          type: string
        question:
          type: string
        questionHindi:
          type: string
        category:
          type: string
          enum: [toss, innings, over, batsman, bowler, match_winner]
        yesPrice:
          type: number
        noPrice:
          type: number
        status:
          type: string
          enum: [open, paused, closed, settled, refunded]
        correctAnswer:
          type: string
          enum: [YES, NO]
        totalYes:
          type: integer
        totalNo:
          type: integer
        totalAmount:
          type: number
        yesPool:
          type: number
        noPool:
          type: number
        createdAt:
          type: string
          format: date-time
        settledAt:
          type: string
          format: date-time
      required:
        - id
        - matchId
        - question
        - category
        - yesPrice
        - noPrice
        - status
        - totalYes
        - totalNo
        - totalAmount
        - createdAt

    MarketListResponse:
      type: object
      properties:
        markets:
          type: array
          items:
            $ref: "#/components/schemas/Market"
        total:
          type: integer
      required:
        - markets
        - total

    CreateMarketRequest:
      type: object
      properties:
        question:
          type: string
        questionHindi:
          type: string
        category:
          type: string
          enum: [toss, innings, over, batsman, bowler, match_winner]
        yesPrice:
          type: number
          default: 2.0
        noPrice:
          type: number
          default: 2.0
      required:
        - question
        - category

    UpdateMarketRequest:
      type: object
      properties:
        status:
          type: string
          enum: [open, paused, closed]
        yesPrice:
          type: number
        noPrice:
          type: number

    SettleMarketRequest:
      type: object
      properties:
        correctAnswer:
          type: string
          enum: [YES, NO]
      required:
        - correctAnswer

    SettlementResult:
      type: object
      properties:
        marketId:
          type: string
        totalPredictions:
          type: integer
        winnersCount:
          type: integer
        totalPayout:
          type: number
        status:
          type: string
      required:
        - marketId
        - totalPredictions
        - winnersCount
        - totalPayout
        - status

    # ─── Predictions ───────────────────────────────────────────────────────────
    PlacePredictionRequest:
      type: object
      properties:
        choice:
          type: string
          enum: [YES, NO]
        amount:
          type: number
          minimum: 100
      required:
        - choice
        - amount

    Prediction:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        marketId:
          type: string
        matchId:
          type: string
        question:
          type: string
        choice:
          type: string
          enum: [YES, NO]
        amount:
          type: number
        potentialWin:
          type: number
        status:
          type: string
          enum: [pending, won, lost, refunded]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - marketId
        - choice
        - amount
        - potentialWin
        - status
        - createdAt

    PredictionListResponse:
      type: object
      properties:
        predictions:
          type: array
          items:
            $ref: "#/components/schemas/Prediction"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - predictions
        - total
        - page
        - limit

    # ─── Admin Stats ───────────────────────────────────────────────────────────
    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        activeUsers:
          type: integer
        totalMatches:
          type: integer
        liveMatches:
          type: integer
        totalPredictions:
          type: integer
        pendingPredictions:
          type: integer
        totalVolume:
          type: number
        totalPayout:
          type: number
        platformRevenue:
          type: number
        todayDeposits:
          type: number
        todayWithdrawals:
          type: number
        todayBets:
          type: number
        todayProfit:
          type: number
        totalDeposits:
          type: number
        totalWithdrawals:
          type: number
        pendingDeposits:
          type: integer
        pendingWithdrawals:
          type: integer
        predictionSuccessRate:
          type: number
        pendingDepositsCount:
          type: integer
        pendingDepositsAmount:
          type: number
        pendingWithdrawalsCount:
          type: integer
        pendingWithdrawalsAmount:
          type: number
      required:
        - totalUsers
        - activeUsers
        - totalMatches
        - liveMatches
        - totalPredictions
        - pendingPredictions
        - totalVolume
        - totalPayout
        - platformRevenue
        - todayDeposits
        - todayWithdrawals
        - todayBets
        - todayProfit
        - totalDeposits
        - totalWithdrawals
        - pendingDeposits
        - pendingWithdrawals
        - predictionSuccessRate
        - pendingDepositsCount
        - pendingDepositsAmount
        - pendingWithdrawalsCount
        - pendingWithdrawalsAmount

    AdminChartDataPoint:
      type: object
      properties:
        date:
          type: string
        deposits:
          type: number
        withdrawals:
          type: number
        bets:
          type: number
        revenue:
          type: number
      required: [date, deposits, withdrawals, bets, revenue]

    AdminChartResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminChartDataPoint"
      required: [data]

    # ─── Cricket ───────────────────────────────────────────────────────────────
    CricketMatch:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        venue:
          type: string
        date:
          type: string
        teams:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - status

    CricketLiveResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/CricketMatch"
        total:
          type: integer
      required:
        - matches
        - total

    CricketScoreResponse:
      type: object
      properties:
        matchId:
          type: string
        name:
          type: string
        status:
          type: string
        score:
          type: array
          items:
            type: object
            properties:
              r:
                type: integer
              w:
                type: integer
              o:
                type: number
              inning:
                type: string
        teams:
          type: array
          items:
            type: string
      required:
        - matchId
        - name
        - status

    # ─── Deposits ──────────────────────────────────────────────────────────────
    CreateDepositRequest:
      type: object
      properties:
        amount:
          type: number
          minimum: 200
        method:
          type: string
          enum: [upi_deeplink, manual]
        utrNumber:
          type: string
        screenshotBase64:
          type: string
      required:
        - amount
        - method

    Deposit:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        amount:
          type: number
        method:
          type: string
          enum: [upi_deeplink, manual]
        utrNumber:
          type: string
        hasScreenshot:
          type: boolean
        screenshotBase64:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        remarks:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - amount
        - method
        - hasScreenshot
        - status
        - createdAt
        - updatedAt

    DepositListResponse:
      type: object
      properties:
        deposits:
          type: array
          items:
            $ref: "#/components/schemas/Deposit"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - deposits
        - total
        - page
        - limit

    AdminDepositUser:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        name:
          type: string

    AdminDeposit:
      allOf:
        - $ref: "#/components/schemas/Deposit"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/AdminDepositUser"

    AdminDepositListResponse:
      type: object
      properties:
        deposits:
          type: array
          items:
            $ref: "#/components/schemas/AdminDeposit"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - deposits
        - total
        - page
        - limit

    # ─── Withdrawals ───────────────────────────────────────────────────────────
    BankAccount:
      type: object
      properties:
        bankName:
          type: string
        holderName:
          type: string
        accountNumber:
          type: string
        confirmAccountNumber:
          type: string
        ifsc:
          type: string
      required:
        - bankName
        - holderName
        - accountNumber
        - ifsc

    CreateWithdrawalRequest:
      type: object
      properties:
        amount:
          type: number
          minimum: 500
        upiId:
          type: string
        bankAccount:
          $ref: "#/components/schemas/BankAccount"
      required:
        - amount

    Withdrawal:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        amount:
          type: number
        upiId:
          type: string
        bankAccount:
          $ref: "#/components/schemas/BankAccount"
        status:
          type: string
          enum: [pending, approved, rejected]
        remarks:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - amount
        - status
        - createdAt
        - updatedAt

    WithdrawalListResponse:
      type: object
      properties:
        withdrawals:
          type: array
          items:
            $ref: "#/components/schemas/Withdrawal"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - withdrawals
        - total
        - page
        - limit

    AdminWithdrawalUser:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        name:
          type: string
        walletBalance:
          type: number

    AdminWithdrawal:
      allOf:
        - $ref: "#/components/schemas/Withdrawal"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/AdminWithdrawalUser"

    AdminWithdrawalListResponse:
      type: object
      properties:
        withdrawals:
          type: array
          items:
            $ref: "#/components/schemas/AdminWithdrawal"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - withdrawals
        - total
        - page
        - limit

    # ─── Notifications ─────────────────────────────────────────────────────────
    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
          enum:
            - deposit_submitted
            - deposit_approved
            - deposit_rejected
            - withdrawal_submitted
            - withdrawal_approved
            - withdrawal_rejected
            - prediction_won
            - prediction_lost
            - wallet_credited
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - type
        - title
        - body
        - read
        - createdAt

    NotificationListResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total:
          type: integer
        unreadCount:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - notifications
        - total
        - unreadCount
        - page
        - limit

